<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>快速聯絡</title>

<style>
:root {
  --green: #06c755;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: radial-gradient(circle at 30% 20%, #1f1f1f, #000);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
  color: white;
}

/* ===== 背景柔光（高級關鍵） ===== */
.glow {
  position: fixed;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(6,199,85,0.15), transparent 70%);
  top: -100px;
  right: -100px;
  filter: blur(80px);
  z-index: 0;
}

/* 主體 */
.container {
  width: 90%;
  max-width: 420px;
  text-align: center;
  z-index: 2;
}

/* ===== 主按鈕 ===== */
.main-btn {
  padding: 18px;
  border-radius: 18px;
  background: linear-gradient(135deg, #06c755, #04a944);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(6,199,85,0.35);
  transition: 0.3s;
  animation: breathe 2.5s ease-in-out infinite;
}

.main-btn:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 15px 40px rgba(6,199,85,0.5);
}

/* 呼吸感 */
@keyframes breathe {
  0% { box-shadow: 0 10px 30px rgba(6,199,85,0.25); }
  50% { box-shadow: 0 20px 50px rgba(6,199,85,0.45); }
  100% { box-shadow: 0 10px 30px rgba(6,199,85,0.25); }
}

/* ===== QR 卡片 ===== */
.qr-box {
  margin-top: 16px;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(16px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  transition: 0.3s;
}

/* 微浮動 */
.qr-box:hover {
  transform: translateY(-4px);
}

.qr-text {
  font-size: 13px;
  opacity: 0.7;
  margin-bottom: 12px;
}

.qr-box img {
  width: 200px;
  border-radius: 12px;
}

/* ===== 點擊吸附（保留但弱化） ===== */
.orb {
  position: fixed;
  left: 50%;
  bottom: 120px;
  width: 12px;
  height: 12px;
  background: #06c755;
  border-radius: 50%;
  transform: translateX(-50%);
  filter: blur(4px);
  opacity: 0;
}

.animate .orb {
  animation: absorb 1s ease forwards;
}

@keyframes absorb {
  0% { bottom: 120px; opacity: 0.8; }
  100% { bottom: 100vh; opacity: 0; }
}

/* ===== LINE提示 ===== */
.tip {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 13px;
  display: none;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="tip" id="tip">⚠️ 請點畫面中「⋯」→ 用瀏覽器開啟</div>

<div class="container" id="container">

  <div class="main-btn" onclick="goLINE()">
    立即加入 LINE（東京宅建士 Shin）
  </div>

  <div class="qr-box">
    <div class="qr-text">或掃描 QR Code 加入</div>
    <img src="qrline.jpg">
  </div>

</div>

<div class="orb"></div>

<script>
function goLINE() {

  if (navigator.vibrate) navigator.vibrate(30);

  const container = document.getElementById("container");
  container.classList.add("animate");

  setTimeout(() => {
    openLINE();
  }, 1000);
}

function openLINE() {
  const webURL = "https://line.me/ti/p/KwFJgZCs3r";
  const appURL = "https://line.me/ti/p/KwFJgZCs3r";

  const ua = navigator.userAgent;

  const isLine = ua.includes("Line");
  const isMobile = /iPhone|Android/i.test(ua);

  if (isLine) {
    document.getElementById("tip").style.display = "block";
    return;
  }

  if (isMobile) {
    window.location.href = appURL;

    setTimeout(() => {
      window.location.href = webURL;
    }, 1200);
  } else {
    window.open(webURL, "_blank");
  }
}
</script>

</body>
</html>
