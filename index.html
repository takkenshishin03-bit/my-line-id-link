<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>快速聯絡</title>

<style>
:root {
  --green: #06c755;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #1a1a1a, #000);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
  color: white;
}



/* 主按鈕 */
.main-btn {
  padding: 18px;
  border-radius: 18px;
  background: linear-gradient(135deg, #06c755, #04a944);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(6,199,85,0.5);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 rgba(6,199,85,0.4); }
  50% { box-shadow: 0 0 25px rgba(6,199,85,0.8); }
  100% { box-shadow: 0 0 0 rgba(6,199,85,0.4); }
}

/* QR */
.qr-box {
  margin-top: 18px;
  padding: 18px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
}

.qr-text {
  font-size: 13px;
  opacity: 0.7;
  margin-bottom: 10px;
}

.qr-box img {
  width: 200px;
  border-radius: 10px;
}

/* 光球吸附 */
.orb {
  position: fixed;
  left: 50%;
  bottom: 120px;
  width: 14px;
  height: 14px;
  background: #06c755;
  border-radius: 50%;
  transform: translateX(-50%);
  filter: blur(3px);
  opacity: 0;
}

.animate .orb {
  animation: absorb 1.2s ease forwards;
}

@keyframes absorb {
  0% { bottom: 120px; opacity: 1; transform: translateX(-50%) scale(0.8);}
  100% { bottom: 100vh; opacity: 0; transform: translateX(-50%) scale(0.2);}
}

/* LINE內提示 */
.tip {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 13px;
  display: none;
}
</style>
</head>

<body>

<div class="bg-line"></div>

<div class="tip" id="tip">請點右上角 → 用瀏覽器開啟</div>

<div class="container" id="container">

  <div class="main-btn" onclick="goLINE()">
    🚀 立即加入 LINE（東京宅建士 Shin）
  </div>

  <div class="qr-box">
    <div class="qr-text">或掃描 QR Code 加入</div>
    <img src="qrline.jpg">
  </div>

</div>

<div class="orb"></div>

<script>
function goLINE() {

  // 手機震動（增加回饋）
  if (navigator.vibrate) navigator.vibrate(30);

  const container = document.getElementById("container");
  container.classList.add("animate");

  setTimeout(() => {
    openLINE();
  }, 1000);
}

function openLINE() {
  const webURL = "https://line.me/ti/p/KwFJgZCs3r";
  const appURL = "https://line.me/ti/p/KwFJgZCs3r";

  const ua = navigator.userAgent;

  const isLine = ua.includes("Line");
  const isMobile = /iPhone|Android/i.test(ua);

  // LINE內建瀏覽器提示
  if (isLine) {
    document.getElementById("tip").style.display = "block";
    return;
  }

  if (isMobile) {
    window.location.href = appURL;

    setTimeout(() => {
      window.location.href = webURL;
    }, 1200);
  } else {
    window.open(webURL, "_blank");
  }
}
</script>

</body>
</html>
