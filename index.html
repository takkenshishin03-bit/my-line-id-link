<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>加入LINE好友</title>

<style>
:root {
  --green: #06c755;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #eef2f7, #dfe7f1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}

.container {
  width: 90%;
  max-width: 420px;
  text-align: center;
}

/* 卡片 */
.card {
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.6);
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,0.4);
  box-shadow: 0 20px 50px rgba(0,0,0,0.08);
}

/* ===== 進場動畫 ===== */
.fade-up {
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 0.9s ease forwards;
}

.delay-1 { animation-delay: 0.2s; }
.delay-2 { animation-delay: 0.5s; }
.delay-3 { animation-delay: 0.8s; }

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 上方按鈕 */
.link-box {
  padding: 18px;
  margin-bottom: 10px;
  cursor: pointer;
}

.link-box a {
  text-decoration: none;
  color: var(--green);
  font-size: 18px;
  font-weight: 600;
}

/* ===== 線條（流動） ===== */
.line {
  position: relative;
  width: 2px;
  height: 90px;
  margin: 0 auto;
  overflow: visible;
}

.line::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 200%;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(6,199,85,0.8),
    transparent
  );
  animation: flow 2.5s linear infinite;
  filter: blur(0.5px);
}

@keyframes flow {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100%); }
}

/* ===== 光球＋拖尾 ===== */
.orb {
  position: absolute;
  left: 50%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--green);
  transform: translateX(-50%);
  filter: blur(2px);
  opacity: 0;
}

.trail {
  position: absolute;
  left: 50%;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--green);
  transform: translateX(-50%);
  filter: blur(6px);
  opacity: 0;
}

.animate .orb {
  animation: orbMove 1.5s ease forwards;
}

.animate .trail:nth-child(2) {
  animation: trailMove 1.5s ease forwards;
  animation-delay: 0.05s;
}
.animate .trail:nth-child(3) {
  animation: trailMove 1.5s ease forwards;
  animation-delay: 0.1s;
}
.animate .trail:nth-child(4) {
  animation: trailMove 1.5s ease forwards;
  animation-delay: 0.15s;
}

@keyframes orbMove {
  0% {
    top: 80px;
    transform: translateX(-50%) scale(0.6);
    opacity: 0;
  }
  20% { opacity: 1; }
  50% {
    transform: translateX(-50%) scale(1.3);
  }
  100% {
    top: -15px;
    transform: translateX(-50%) scale(0.4);
    opacity: 0;
  }
}

@keyframes trailMove {
  0% {
    top: 80px;
    opacity: 0;
  }
  20% {
    opacity: 0.4;
  }
  100% {
    top: -15px;
    opacity: 0;
  }
}

/* 中間文字 */
.middle-text {
  font-size: 14px;
  color: #666;
  margin: 20px 0 25px;
}

/* QR */
.qr-box {
  padding: 30px;
}

.qr-box img {
  width: 200px;
  border-radius: 12px;
}

</style>
</head>

<body>

<div class="container" id="container">

  <!-- 上 -->
  <div class="card link-box fade-up delay-1" onclick="startAnimation()">
    <a href="javascript:void(0)">點擊加入 LINE 好友</a>
  </div>

  <!-- 線 -->
  <div class="line fade-up delay-2">
    <div class="orb"></div>
    <div class="trail"></div>
    <div class="trail"></div>
    <div class="trail"></div>
  </div>

  <!-- 文字 -->
  <div class="middle-text fade-up delay-2">
    或者點取上面連結自動跳轉LINE
  </div>

  <!-- QR -->
  <div class="card qr-box fade-up delay-3">
    <img src="qrline.jpg" alt="QR Code">
  </div>

</div>

<script>
function startAnimation() {
  const container = document.getElementById("container");
  const link = "https://line.me/ti/p/shenken0330";

  if (container.classList.contains("animate")) return;

  container.classList.add("animate");

  setTimeout(() => {
    window.location.href = link;
  }, 1500);
}
</script>

</body>
</html>
