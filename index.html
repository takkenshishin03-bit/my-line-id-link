<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>加入LINE好友</title>

<style>
:root {
  --green: #06c755;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #eef2f7, #dfe7f1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}

/* 背景流光 */
.bg-line {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 3px;
  height: 120%;
  z-index: 0;
}

.bg-line::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 200%;
  background: linear-gradient(to top, transparent, rgba(6,199,85,0.9), transparent);
  animation: flowUp 2s linear infinite;
  filter: blur(1px);
}

@keyframes flowUp {
  0% { transform: translateY(100%); }
  100% { transform: translateY(-100%); }
}

/* 主體 */
.container {
  width: 90%;
  max-width: 420px;
  text-align: center;
  position: relative;
  z-index: 2;
}

.card {
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.6);
  border-radius: 22px;
  padding: 20px;
  border: 1px solid rgba(255,255,255,0.4);
}

/* 按鈕 */
.link-box {
  cursor: pointer;
  margin-bottom: 12px;
}

.link-box a {
  display: block;
  padding: 16px;
  border-radius: 14px;
  text-decoration: none;
  color: white;
  font-weight: 600;
  background: linear-gradient(135deg, #06c755, #04a944);
  box-shadow: 0 8px 20px rgba(6,199,85,0.4);
}

/* QR */
.qr-box {
  padding: 20px;
}

.qr-text {
  font-size: 13px;
  color: #555;
  margin-bottom: 10px;
}

.qr-box img {
  width: 200px;
  border-radius: 12px;
}

/* 光球 */
.orb {
  position: absolute;
  left: 50%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--green);
  transform: translateX(-50%);
  filter: blur(2px);
  opacity: 0;
}

.animate .orb {
  animation: orbMove 1.5s ease forwards;
}

@keyframes orbMove {
  0% { top: 60px; opacity: 0; }
  20% { opacity: 1; }
  100% { top: -100vh; opacity: 0; }
}
</style>
</head>

<body>

<div class="bg-line"></div>

<div class="container" id="container">

  <!-- LINE 按鈕（關鍵改這裡） -->
  <div class="card link-box" onclick="startAnimation(event)">
    <a id="lineLink" href="https://line.me/ti/p/KwFJgZCs3r" target="_blank">
      點擊加入 LINE 好友
    </a>
  </div>

  <!-- 光球 -->
  <div style="position: relative; height:0;">
    <div class="orb"></div>
  </div>

  <!-- QR -->
  <div class="card qr-box">
    <div class="qr-text">或者點取上面連結自動跳轉LINE</div>
    <img src="qrline.jpg">
  </div>

</div>

<script>
function startAnimation(e) {
  e.preventDefault(); // 阻止立即跳轉

  const container = document.getElementById("container");
  const link = document.getElementById("lineLink");

  if (container.classList.contains("animate")) return;

  container.classList.add("animate");

  // 1.5 秒後「用原生方式點擊」
  setTimeout(() => {
    link.click();
  }, 1500);
}
</script>

</body>
</html>
