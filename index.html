<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>加入LINE好友</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    /* 上方按鈕 */
    .link-box {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .link-box:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    .link-box a {
      text-decoration: none;
      color: #06c755;
      font-weight: 600;
      font-size: 18px;
      display: block;
    }

    /* 中間文字 */
    .middle-text {
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    /* QR 區 */
    .qr-box {
      background: white;
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .qr-box img {
      width: 100%;
      max-width: 220px;
      border-radius: 12px;
    }

    .qr-title {
      margin-bottom: 15px;
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

  </style>
</head>

<body>
  <div class="container">

    <!-- 上方連結 -->
    <div class="link-box">
      <a href="YOUR_LINE_LINK" target="_blank">
        點我加入LINE好友
      </a>
    </div>

    <!-- 中間說明 -->
    <div class="middle-text">
      或者點取上面連結自動跳轉LINE
    </div>

    <!-- QR Code -->
    <div class="qr-box">
      <div class="qr-title">掃描QR Code加入</div>
      <img src="qr.png" alt="LINE QR Code">
    </div>

  </div>
</body>
</html>
